    <main>
        <section>
            <div class="forms-container">
                <div class="form-box">
                    <h2>CONTACTO</h2>
                    <form id="contactForm" action="#" method="post">
                        <label for="contact-name">Nombre</label>
                        <input id="contact-name" name="name" type="text" placeholder="Tu nombre" required>

                        <label for="contact-email">Correo</label>
                        <input id="contact-email" name="email" type="email" placeholder="tu@ejemplo.com" required>

                        <label for="contact-message">Mensaje</label>
                        <textarea id="contact-message" name="message" rows="4" placeholder="Escribe tu mensaje" required></textarea>

                        <div style="margin-top:1rem">
                            <button type="submit" class="full-width">Enviar mensaje</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
